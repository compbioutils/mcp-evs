[project]
name = "evs-cadsr-mcp"
version = "0.1.0"
description = "MCP server over NCI EVS (NCI Thesaurus) and caDSR, hosted in FastAPI. Prototype: EVS, caDSR and mapping modules."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "bensonml" }]
dependencies = [
    "fastmcp>=3.4.11,<4",
    "mcp>=1.30",
    "fastapi>=0.165",
    "starlette>=1.10",
    "uvicorn[standard]>=0.54",
    "httpx>=0.28.1",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "cachetools>=5.3",
    "structlog>=24.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
redis = ["redis>=8.1"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
evs-cadsr-mcp = "evs_cadsr_mcp.server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evs_cadsr_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that call the live EVS REST API (deselect with -m 'not live')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Long lines are widespread in the existing code; revisit with a `ruff format` pass.
extend-ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tool-argument defaults: FastMCP/pydantic copy them per call, and they appear in the tool schema.
"src/evs_cadsr_mcp/*/tools/*.py" = ["B006", "B008"]
