# Run before each commit: `pre-commit install` once per clone (https://pre-commit.com).
# If .git/hooks/pre-commit already exists (e.g. git-secrets), pre-commit keeps it and runs it
# first ("migration mode").
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks  # rules from .gitleaks.toml
